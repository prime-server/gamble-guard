# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). `xcodegen generate` in this folder
# rebuilds GambleGuard.xcodeproj; the checked-in project is hand-written to the same shape.
name: GambleGuard
options:
  bundleIdPrefix: org.gambleguard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: YOUR_TEAM_ID
targets:
  GambleGuard:
    type: application
    platform: iOS
    sources:
      - path: GambleGuard
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.gambleguard.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: GambleGuard/Info.plist
        CODE_SIGN_ENTITLEMENTS: GambleGuard/GambleGuard.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
