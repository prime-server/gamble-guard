<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">How gamble-guard works: five layers</title>
<desc id="d">Hand-drawn diagram: a filtering DNS cloud with a crossed-out die, a hosts-file paper list, three locked browser windows, two watchdogs restoring each other, and an hourglass for the 7-day cooling-off.</desc>
<defs>
<filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="11" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<style>
.hand{font-family:'Bradley Hand','Segoe Print','Comic Sans MS','Marker Felt',cursive,sans-serif}
.ink{fill:none;stroke:#1f2a44;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.h{font-size:24px;font-weight:bold;fill:#1f2a44;text-anchor:middle}
.s{font-size:19px;fill:#4a5368;text-anchor:middle}
.n{font-size:26px;font-weight:bold;fill:#1f2a44;text-anchor:middle}
</style>
</defs>

<g filter="url(#wob)">
<rect x="10" y="10" width="1180" height="500" rx="30" fill="#fbf7ee" stroke="#1f2a44" stroke-width="3.5"/>
</g>

<text class="hand" x="600" y="62" font-size="32" fill="#1f2a44" text-anchor="middle">five layers. each one covers how the last one gets beaten.</text>

<!-- number badges -->
<g filter="url(#wob)" class="ink">
<circle cx="130" cy="110" r="20" fill="#f6d78a"/>
<circle cx="365" cy="110" r="20" fill="#f6d78a"/>
<circle cx="600" cy="110" r="20" fill="#f6d78a"/>
<circle cx="835" cy="110" r="20" fill="#f6d78a"/>
<circle cx="1070" cy="110" r="20" fill="#f6d78a"/>
</g>
<text class="hand n" x="130" y="120">1</text>
<text class="hand n" x="365" y="120">2</text>
<text class="hand n" x="600" y="120">3</text>
<text class="hand n" x="835" y="120">4</text>
<text class="hand n" x="1070" y="120">5</text>

<!-- arrows between columns -->
<g filter="url(#wob)" class="ink" stroke="#8a8f99">
<path d="M 232 248 Q 250 240 266 248 M 256 240 L 266 248 L 256 255"/>
<path d="M 467 248 Q 485 240 501 248 M 491 240 L 501 248 L 491 255"/>
<path d="M 702 248 Q 720 240 736 248 M 726 240 L 736 248 L 726 255"/>
<path d="M 937 248 Q 955 240 971 248 M 961 240 L 971 248 L 961 255"/>
</g>

<!-- 1: cloud with blocked die -->
<g filter="url(#wob)" class="ink">
<path d="M 72 282 C 44 282 40 244 70 238 C 66 208 102 194 120 214 C 130 182 184 186 186 222 C 214 222 220 274 190 282 Z" fill="#fff"/>
<rect x="110" y="230" width="38" height="38" rx="7" fill="#fff"/>
<circle cx="120" cy="240" r="3.5" fill="#1f2a44" stroke="none"/>
<circle cx="129" cy="249" r="3.5" fill="#1f2a44" stroke="none"/>
<circle cx="138" cy="258" r="3.5" fill="#1f2a44" stroke="none"/>
<path d="M 100 220 L 158 278 M 158 220 L 100 278" stroke="#c2574f" stroke-width="5"/>
</g>
<text class="hand h" x="130" y="332">filtering DNS</text>
<text class="hand s" x="130" y="362">the resolver says no</text>

<!-- 2: hosts file -->
<g filter="url(#wob)" class="ink" transform="rotate(-3 365 230)">
<rect x="313" y="164" width="104" height="134" rx="4" fill="#fff"/>
<path d="M 326 188 H 404 M 326 212 H 404 M 326 236 H 404 M 326 260 H 404 M 326 284 H 380" stroke="#d8d0bd" stroke-width="2"/>
</g>
<g class="hand" transform="rotate(-3 365 230)" font-size="13" fill="#c2574f" font-family="ui-monospace,Menlo,Consolas,monospace">
<text x="326" y="184">0.0.0.0  ****</text>
<text x="326" y="208">0.0.0.0  ****</text>
<text x="326" y="232">0.0.0.0  ****</text>
<text x="326" y="256">0.0.0.0  ****</text>
<text x="326" y="280">0.0.0.0  ****</text>
</g>
<g filter="url(#wob)" class="ink" transform="rotate(7 405 290)">
<rect x="378" y="272" width="56" height="34" rx="3" fill="#f6d78a"/>
</g>
<text class="hand" x="406" y="296" font-size="18" font-weight="bold" fill="#1f2a44" text-anchor="middle" transform="rotate(7 405 290)">660k</text>
<text class="hand h" x="365" y="332">hosts file</text>
<text class="hand s" x="365" y="362">every domain to 0.0.0.0</text>

<!-- 3: browsers locked -->
<g filter="url(#wob)" class="ink">
<rect x="538" y="166" width="112" height="82" rx="6" fill="#fff"/>
<path d="M 538 186 H 650" stroke-width="2.5"/>
<rect x="558" y="188" width="112" height="82" rx="6" fill="#fff"/>
<path d="M 558 208 H 670" stroke-width="2.5"/>
<rect x="578" y="210" width="112" height="82" rx="6" fill="#fff"/>
<path d="M 578 230 H 690" stroke-width="2.5"/>
<circle cx="590" cy="220" r="3" fill="#c2574f" stroke="none"/>
<circle cx="601" cy="220" r="3" fill="#e3a33a" stroke="none"/>
<circle cx="612" cy="220" r="3" fill="#4f9a6a" stroke="none"/>
<path d="M 646 268 V 258 A 13 13 0 0 1 672 258 V 268" stroke-width="5"/>
<rect x="636" y="266" width="46" height="34" rx="7" fill="#f6d78a"/>
<circle cx="659" cy="281" r="4" fill="#1f2a44" stroke="none"/>
<path d="M 659 283 V 292" stroke-width="3.5"/>
</g>
<text class="hand h" x="600" y="332">browsers locked</text>
<text class="hand s" x="600" y="362">DoH off, system DNS only</text>

<!-- 4: two watchdogs -->
<g filter="url(#wob)" class="ink" stroke="#8a8f99">
<path d="M 798 212 Q 835 182 872 212 M 862 202 L 872 212 L 860 216"/>
<path d="M 872 224 Q 835 250 798 224 M 808 234 L 798 224 L 810 220"/>
</g>
<g filter="url(#wob)" class="ink">
<g transform="translate(778 282)">
<path d="M -14 14 V 32 M -4 14 V 32 M 10 14 V 32 M 20 12 V 32"/>
<path d="M -26 -4 Q -42 -16 -36 -30"/>
<ellipse cx="0" cy="0" rx="27" ry="16" fill="#fff"/>
<circle cx="28" cy="-14" r="13" fill="#fff"/>
<ellipse cx="20" cy="-22" rx="5" ry="9" fill="#1f2a44" stroke="none" transform="rotate(20 20 -22)"/>
<circle cx="32" cy="-16" r="2" fill="#1f2a44" stroke="none"/>
<circle cx="40" cy="-11" r="2.5" fill="#1f2a44" stroke="none"/>
<path d="M 16 -4 Q 26 4 34 -2" stroke="#c2574f" stroke-width="3"/>
</g>
<g transform="translate(892 282) scale(-1 1)">
<path d="M -14 14 V 32 M -4 14 V 32 M 10 14 V 32 M 20 12 V 32"/>
<path d="M -26 -4 Q -42 -16 -36 -30"/>
<ellipse cx="0" cy="0" rx="27" ry="16" fill="#fff"/>
<circle cx="28" cy="-14" r="13" fill="#fff"/>
<ellipse cx="20" cy="-22" rx="5" ry="9" fill="#1f2a44" stroke="none" transform="rotate(20 20 -22)"/>
<circle cx="32" cy="-16" r="2" fill="#1f2a44" stroke="none"/>
<circle cx="40" cy="-11" r="2.5" fill="#1f2a44" stroke="none"/>
<path d="M 16 -4 Q 26 4 34 -2" stroke="#4f9a6a" stroke-width="3"/>
</g>
</g>
<text class="hand h" x="835" y="332">two watchdogs</text>
<text class="hand s" x="835" y="362">each puts the other back</text>

<!-- 5: hourglass + 7 days -->
<g filter="url(#wob)" class="ink">
<path d="M 1032 180 L 1090 180 L 1068 240 L 1090 300 L 1032 300 L 1054 240 Z" fill="#fff"/>
<path d="M 1044 202 L 1078 202 L 1064 236 L 1058 236 Z" fill="#f6d78a" stroke="none"/>
<path d="M 1040 300 L 1082 300 L 1072 282 L 1050 282 Z" fill="#f6d78a" stroke="none"/>
<path d="M 1061 244 V 280" stroke="#e3a33a" stroke-width="2.5" stroke-dasharray="3 4"/>
<rect x="1026" y="170" width="70" height="10" rx="3" fill="#1f2a44"/>
<rect x="1026" y="300" width="70" height="10" rx="3" fill="#1f2a44"/>
<rect x="1104" y="252" width="56" height="50" rx="5" fill="#fff"/>
<rect x="1104" y="252" width="56" height="13" rx="3" fill="#c2574f"/>
</g>
<text class="hand" x="1132" y="294" font-size="26" font-weight="bold" fill="#1f2a44" text-anchor="middle">7d</text>
<text class="hand h" x="1070" y="332">removal is slow</text>
<text class="hand s" x="1070" y="362">uninstall waits 7 days</text>

<!-- honest footer -->
<path class="ink" filter="url(#wob)" d="M 120 410 C 400 404 800 416 1080 408" stroke="#d8d0bd" stroke-width="2.5"/>
<text class="hand" x="600" y="452" font-size="21" fill="#4a5368" text-anchor="middle">this is friction, not a lock: an admin can still undo it. the strongest lock is another person.</text>
<text class="hand" x="600" y="484" font-size="19" fill="#8a8f99" text-anchor="middle">friction usually wins anyway. a craving lasts minutes; the cooling-off lasts a week.</text>
</svg>
