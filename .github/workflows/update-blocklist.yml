name: update blocklist
on:
  schedule:
    - cron: '17 4 * * 1'     # weekly, Monday 04:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rebuild lists from upstream sources
        run: tools/build-list.sh
      - name: commit if changed
        run: |
          git config user.name  gamble-guard
          git config user.email noreply@github.com
          git add lists/
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "lists: weekly rebuild $(date -u +%Y-%m-%d)"
          git push
